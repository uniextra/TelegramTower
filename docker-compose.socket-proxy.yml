services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - EVENTS=1
      - INFO=1
      - POST=1
      # Disable sensitive endpoints
      - EXEC=0
      - VOLUMES=0
      - SECRETS=0
      - SWARM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal-net

  telegramtower:
    build: .
    image: telegramtower:latest
    container_name: telegramtower
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEB_HOST=0.0.0.0
      - WEB_USER=${WEB_USER:-admin}
      - WEB_PASSWORD=${WEB_PASSWORD:?Define a secure WEB_PASSWORD}
    networks:
      - internal-net
    depends_on:
      - socket-proxy

networks:
  internal-net:
    internal: true
